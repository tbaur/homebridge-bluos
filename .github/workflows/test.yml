name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: these jobs only read the repo and run build/lint/test.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript
      run: npm run build

    # dist/ is committed (so git installs work); fail if it drifted from src/
    # or if build produced untracked files under dist/ that were not committed.
    - name: Verify committed dist is in sync with src
      run: |
        if [ -n "$(git status --porcelain -- dist)" ]; then
          echo "dist/ is dirty or has untracked files after build:"
          git status --porcelain -- dist
          exit 1
        fi
        git diff --exit-code -- dist

    - name: Run linter
      run: npm run lint

    - name: Type-check tests against production settings
      run: npx tsc --noEmit -p tsconfig.test.json

    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: matrix.node-version == '20.x'
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7

  # engines.homebridge claims ^1.6.0 support, but devDependencies pin 2.x. This
  # job is what makes that claim true rather than aspirational.
  homebridge-floor:
    name: Verify oldest supported Homebridge
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: '22.x'
        cache: 'npm'
    - run: npm ci
    - name: Install the oldest supported Homebridge
      run: npm install --no-save homebridge@1.6.1
    - name: Type-check against Homebridge 1.6
      run: npx tsc --noEmit -p tsconfig.test.json
    - name: Run tests against Homebridge 1.6
      run: NODE_ENV=test npx jest --coverage=false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: '24.x'
        cache: 'npm'
    - run: npm ci
    # Gates the release. The runtime surface is deliberately two packages —
    # multicast-dns for discovery and the Homebridge UI utils for the settings
    # page — so an advisory here is both rare and worth stopping for.
    - name: Audit runtime dependencies
      run: npm audit --omit=dev --audit-level=moderate
    # Dev dependencies are the real surface (and the reason the overrides in
    # package.json exist), but a transitive advisory there should not block a
    # release, so this reports without failing.
    - name: Audit development dependencies
      run: npm audit --audit-level=high || echo "::warning::Development dependency advisories found; review npm audit output"
