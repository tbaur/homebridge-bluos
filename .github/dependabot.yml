# Dependabot keeps dependencies current. Two packages reach the runtime path —
# multicast-dns for discovery and the Homebridge UI utils for the settings page —
# so those arrive as individual PRs; development updates are grouped to reduce
# noise.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    ignore:
      # TypeScript 7.0 dropped the compiler API that typescript-eslint 8 and
      # ts-jest still import. Language-identical to 6; stay until 7.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch only low-risk patch/minor development updates so they stay
      # auto-mergeable. Major bumps (e.g. eslint, jest, typescript, homebridge
      # types) are left out of the group so each arrives as its own PR.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
