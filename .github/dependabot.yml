# Dependabot keeps dependencies current. Two packages reach the runtime path —
# multicast-dns for discovery and the Homebridge UI utils for the settings page —
# so those arrive as individual PRs; development updates are grouped to reduce
# noise.
#
# Runtime bumps are prefixed `fix` and development bumps `chore`, because only
# the former have to reach users: release-please cuts a patch for a `fix` and no
# release at all for a `chore`. A runtime dependency updated under a `chore`
# prefix sits on main until unrelated work happens to ship it, which is how
# @homebridge/plugin-ui-utils 2.2.5 missed the 1.0.0 tarball.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
    ignore:
      # TypeScript 7.0 dropped the compiler API that typescript-eslint 8 and
      # ts-jest still import. Language-identical to 6; stay until 7.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node must track engines.node (^22 || ^24 || ^26), or the compiler
      # accepts an API that does not exist on the oldest runtime a user may be
      # on. Raise both together, deliberately, rather than letting a bump raise
      # one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch only low-risk patch/minor development updates so they stay
      # auto-mergeable. Major bumps (e.g. eslint, jest, typescript, homebridge
      # types) are left out of the group so each arrives as its own PR.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
